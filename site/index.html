<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor do reservatório</title>
<style>
  * {
    box-sizing: border-box
  }

  body {
    margin: 0;
    background: #eef4f7;
    color: #102c42;
    font: 16px system-ui, sans-serif
  }

  main {
    max-width: 1120px;
    margin: auto;
    padding: 36px 20px
  }

  header,
  .grid {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    align-items: flex-start
  }

  h1 {
    font-size: clamp(26px, 5vw, 40px);
    margin: 0 0 8px
  }

  h2 {
    font-size: 19px;
    margin: 0 0 14px
  }

  p {
    margin: 8px 0
  }

  small,
  .muted {
    color: #466176
  }

  .grid {
    display: grid;
    grid-template-columns: 270px minmax(0, 1fr);
    margin: 24px 0;
    align-items: stretch
  }

  section {
    background: white;
    border: 1px solid #d6e4eb;
    border-radius: 18px;
    padding: 22px
  }

  .tank {
    position: relative;
    overflow: hidden;
    height: 190px;
    width: 110px;
    margin: 18px auto;
    border: 3px solid #28516b;
    border-radius: 16px;
    background: #edf7fb
  }

  .water {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 0;
    background: linear-gradient(#43b7e6, #126eac);
    transition: height .35s
  }

  .mark {
    position: absolute;
    bottom: 20%;
    width: 100%;
    border-top: 2px dashed #a24c19
  }

  #level {
    display: block;
    font-size: 40px;
    text-align: center;
    font-weight: 750;
    font-variant-numeric: tabular-nums
  }

  .badge {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 30px;
    background: #e4f0f7;
    white-space: nowrap
  }

  .badge[data-state="warn"] {
    background: #fff0d5;
    color: #773600
  }

  .badge[data-state="ok"] {
    background: #d9f4ea;
    color: #0a5942
  }

  canvas {
    width: 100%;
    height: 260px;
    display: block
  }

  .table {
    overflow: auto
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left
  }

  th,
  td {
    padding: 10px;
    border-bottom: 1px solid #e4edf2;
    white-space: nowrap
  }

  @media(max-width:650px) {
    header {
      flex-direction: column;
      gap: 8px
    }

    .grid {
      grid-template-columns: 1fr
    }
  }
</style>
<main>
  <header>
    <div>
      <h1>Monitor do reservatório</h1><small>Dispositivo reservatorio-01 · ESP32 no Wokwi</small>
    </div><span id="status" class="badge" role="status">Aguardando dados</span>
  </header>
  <div class="grid">
    <section>
      <h2>Nível atual</h2>
      <div class="tank" aria-hidden="true">
        <div id="water" class="water"></div>
        <div class="mark"></div>
      </div>
      <output id="level">—</output>
      <p id="alert" class="badge">Sem leitura</p>
      <p>Distância <strong id="distance">—</strong></p><small>Última leitura <time id="updated">—</time></small>
    </section>
    <section>
      <h2>Histórico do nível</h2>
      <p class="muted">Até 60 leituras · Linha laranja em 20%</p><canvas id="chart" role="img"
        aria-label="Gráfico do nível do reservatório em porcentagem ao longo do tempo"></canvas>
      <p id="notice" class="muted"></p>
    </section>
  </div>
  <section>
    <h2>Leituras recentes</h2>
    <div class="table">
      <table>
        <thead>
          <tr>
            <th scope="col">Horário</th>
            <th scope="col">Distância</th>
            <th scope="col">Nível</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr>
            <td colspan="3">Aguardando dados</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
<script>
  const PUBLIC_KEY = "sb_publishable_bd3_ho3varYaKfhXKkxgtA_9f9PP53I";
  const endpoint = new URL("https://ztuhvkcskdikvqkukhim.supabase.co/rest/v1/readings");
  endpoint.search = new URLSearchParams({
    select: "message_id,distance_cm,level_pct,received_at",
    device_id: "eq.reservatorio-01",
    message_id: "neq.teste-001",
    order: "received_at.desc,message_id.desc",
    limit: "60"
  });
  const $ = id => document.getElementById(id);
  const num = new Intl.NumberFormat("pt-BR", {minimumFractionDigits: 1, maximumFractionDigits: 1});
  const clock = new Intl.DateTimeFormat("pt-BR", {timeStyle: "medium"});
  const date = new Intl.DateTimeFormat("pt-BR", {dateStyle: "short", timeStyle: "medium"});
  const staleAfter = 20_000;
  let readings = [];

  function updateStatus() {
    const latest = readings[0];
    const stale = latest && Date.now() - latest.timestamp > staleAfter;
    $("status").textContent = latest ? (stale ? "Dados desatualizados" : "Dados recentes") : "Aguardando dados";
    $("status").dataset.state = latest ? (stale ? "warn" : "ok") : "";
  }

  function drawChart() {
    const canvas = $("chart");
    const width = canvas.clientWidth, height = canvas.clientHeight;
    const scale = window.devicePixelRatio || 1;
    canvas.width = Math.round(width * scale);
    canvas.height = Math.round(height * scale);
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    ctx.font = "12px system-ui";
    const left = 42, right = width - 12, top = 16, bottom = height - 33;
    const y = level => bottom - level * (bottom - top) / 100;
    for (const level of [0, 20, 40, 60, 80, 100]) {
      ctx.fillStyle = "#466176";
      ctx.fillText(level + "%", 0, y(level) + 4);
      ctx.strokeStyle = level === 20 ? "#b95720" : "#dce8ed";
      ctx.setLineDash(level === 20 ? [5, 4] : []);
      ctx.beginPath();
      ctx.moveTo(left, y(level));
      ctx.lineTo(right, y(level));
      ctx.stroke();
    }
    ctx.setLineDash([]);
    if (!readings.length) {
      ctx.fillText("Sem medições do Wokwi", left + 10, top + 24);
      return;
    }
    const points = [...readings].reverse();
    const start = points[0].timestamp;
    const end = points[points.length - 1].timestamp;
    const x = time => end === start ? (left + right) / 2 : left + (time - start) * (right - left) / (end - start);
    ctx.strokeStyle = "#126eac";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    points.forEach((point, i) => {
      const px = x(point.timestamp), py = y(point.level_pct);
      if (!i || point.timestamp - points[i - 1].timestamp > staleAfter) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.stroke();
    ctx.fillStyle = "#126eac";
    for (const point of points) {
      ctx.beginPath();
      ctx.arc(x(point.timestamp), y(point.level_pct), 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#466176";
    ctx.fillText(clock.format(start), left, height - 10);
    if (end !== start) {
      ctx.textAlign = "right";
      ctx.fillText(clock.format(end), right, height - 10);
    }
  }

  function render() {
    const latest = readings[0];
    $("level").textContent = latest ? num.format(latest.level_pct) + "%" : "—";
    $("water").style.height = latest ? latest.level_pct + "%" : "0%";
    $("distance").textContent = latest ? num.format(latest.distance_cm) + " cm" : "—";
    $("updated").textContent = latest ? date.format(latest.timestamp) : "—";
    $("updated").dateTime = latest ? latest.received_at : "";
    $("alert").textContent = latest ? (latest.level_pct <= 20 ? "Nível baixo" : "Nível normal") : "Sem leitura";
    $("alert").dataset.state = latest ? (latest.level_pct <= 20 ? "warn" : "ok") : "";
    const rows = readings.slice(0, 10).map(reading => {
      const tr = document.createElement("tr");
      for (const value of [date.format(reading.timestamp), num.format(reading.distance_cm) + " cm", num.format(reading.level_pct) + "%"]) {
        tr.insertCell().textContent = value;
      }
      return tr;
    });
    if (!rows.length) {
      const tr = document.createElement("tr");
      const cell = tr.insertCell();
      cell.colSpan = 3;
      cell.textContent = "Sem medições do Wokwi";
      rows.push(tr);
    }
    $("rows").replaceChildren(...rows);
    updateStatus();
    drawChart();
  }

  async function refresh() {
    try {
      const response = await fetch(endpoint, {
        headers: {apikey: PUBLIC_KEY}, cache: "no-store", signal: AbortSignal.timeout(8000)
      });
      if (!response.ok) throw new Error("HTTP " + response.status);
      readings = (await response.json()).map(row => ({...row, timestamp: Date.parse(row.received_at)}));
      $("notice").textContent = "";
      render();
    } catch (error) {
      $("notice").textContent = "Falha ao consultar a API (" + error.message + "). Nova tentativa em instantes.";
    } finally {
      setTimeout(refresh, 5000);
    }
  }

  render();
  window.addEventListener("resize", drawChart);
  setInterval(updateStatus, 1000);
  if (PUBLIC_KEY.startsWith("sb_publishable_")) refresh();
  else $("notice").textContent = "Configure a Publishable key na constante PUBLIC_KEY do index.html.";
</script>

</html>
